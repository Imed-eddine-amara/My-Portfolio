<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#7C4DFF"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">BARE-METAL FIRMWARE</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- Memory Map Table -->
  <rect x="120" y="80" width="560" height="180" rx="8" fill="#1b2438" stroke="#7C4DFF" stroke-width="2"/>
  <g font-family="monospace" font-size="12" fill="#ffffff" transform="translate(140, 115)">
    <text y="0" fill="#7C4DFF" font-weight="bold">// Peripheral Base Address Mapping</text>
    <text y="24" fill="#58E6D9">#define RCC_BASE      (0x40023800UL)</text>
    <text y="48" fill="#58E6D9">#define GPIOA_BASE    (0x40020000UL)</text>
    <text y="75" fill="#FFD600">// Enable GPIOA Clock in AHB1ENR</text>
    <text y="95" fill="#ffffff">RCC->AHB1ENR |= (1UL &lt;&lt; 0);  /* Bit 0: GPIOAEN */</text>
    <text y="120" fill="#FFD600">// Configure MODER Register (Output Mode)</text>
    <text y="140" fill="#ffffff">GPIOA->MODER &amp;= ~(3UL &lt;&lt; (5 * 2)); /* Clear Pin 5 */</text>
    <text y="160" fill="#00E676">GPIOA->MODER |=  (1UL &lt;&lt; (5 * 2)); /* General Output */</text>
  </g>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#7C4DFF" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Bare-Metal CMSIS Peripheral Driver</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">STM32 ARM Cortex // Memory-Mapped I/O // Bit-Masking RCC & GPIO Registers</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>