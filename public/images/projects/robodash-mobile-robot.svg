<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#FF9100"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">ROBOTICS & TELEMETRY</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- Robot Chassis Graphic -->
  <rect x="150" y="100" width="220" height="130" rx="12" fill="#1b2438" stroke="#FF9100" stroke-width="2"/>
  <!-- Wheels -->
  <rect x="130" y="110" width="20" height="40" rx="4" fill="#000000" stroke="#ffffff"/>
  <rect x="130" y="170" width="20" height="40" rx="4" fill="#000000" stroke="#ffffff"/>
  <rect x="370" y="110" width="20" height="40" rx="4" fill="#000000" stroke="#ffffff"/>
  <rect x="370" y="170" width="20" height="40" rx="4" fill="#000000" stroke="#ffffff"/>
  
  <text x="260" y="145" font-family="system-ui" font-size="14" font-weight="bold" fill="#FF9100" text-anchor="middle">ESP32 Core</text>
  <text x="260" y="168" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">PWM Motor Control</text>
  <text x="260" y="188" font-family="monospace" font-size="10" fill="#58E6D9" text-anchor="middle">Ultrasonic Radar</text>

  <!-- WiFi WebSocket -->
  <path d="M 370 165 Q 430 135 480 165" fill="none" stroke="#58E6D9" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="430" y="140" font-family="monospace" font-size="10" fill="#58E6D9" text-anchor="middle">WebSockets</text>

  <!-- Flutter Dashboard App Screen -->
  <rect x="490" y="85" width="180" height="150" rx="10" fill="#0d1117" stroke="#29B6F6" stroke-width="2"/>
  <text x="580" y="115" font-family="system-ui" font-size="13" font-weight="bold" fill="#29B6F6" text-anchor="middle">Flutter App</text>
  <rect x="510" y="130" width="140" height="25" rx="4" fill="#1b2438"/>
  <text x="580" y="147" font-family="monospace" font-size="10" fill="#00E676" text-anchor="middle">Speed: 1.2 m/s</text>
  <rect x="510" y="165" width="140" height="25" rx="4" fill="#1b2438"/>
  <text x="580" y="182" font-family="monospace" font-size="10" fill="#58E6D9" text-anchor="middle">Distance: 42 cm</text>
  <text x="580" y="215" font-family="monospace" font-size="10" fill="#FFD600" text-anchor="middle">Real-time Telemetry</text>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#FF9100" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">ESP32 RoboDash & IoT Connected Vehicle</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">ESP32 Soft-AP // WebSocket Telemetry // H-Bridge PWM Motors // Ultrasonic</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>