<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#FF6D00"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">EMBEDDED LINUX</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- Terminal Window -->
  <rect x="100" y="80" width="600" height="210" rx="8" fill="#0d1117" stroke="#FF6D00" stroke-width="2"/>
  <rect x="100" y="80" width="600" height="28" rx="8" fill="#161b22"/>
  <circle cx="120" cy="94" r="5" fill="#ff5f56"/>
  <circle cx="135" cy="94" r="5" fill="#ffbd2e"/>
  <circle cx="150" cy="94" r="5" fill="#27c93f"/>
  <text x="400" y="99" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">qemu-system-aarch64 -M virt -cpu cortex-a53</text>

  <!-- Terminal Content -->
  <g font-family="monospace" font-size="11" fill="#ffffff" transform="translate(120, 130)">
    <text y="0" fill="#FF6D00">Linux version 6.1.0-buildroot (aarch64-linux-gnu-gcc 12.3.0)</text>
    <text y="22" fill="#58E6D9">[    0.000000] Booting Linux on physical CPU 0x0000000000 [0x410fd034]</text>
    <text y="44" fill="#ffffff">[    1.240192] VFS: Mounted root (ext4 filesystem) on device 254:0.</text>
    <text y="66" fill="#00E676">[ OK ] Starting SysV init scripts...</text>
    <text y="88" fill="#58E6D9">[ OK ] Starting Dropbear SSH daemon on port 22.</text>
    <text y="110" fill="#FFD600">[ OK ] Starting /usr/bin/sysmond (C daemon reading /proc/stat, /proc/meminfo)</text>
    <text y="132" fill="#ffffff">buildroot-aarch64 login: root</text>
  </g>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#FF6D00" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Buildroot-Based Embedded Linux System</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">AArch64 Kernel // QEMU virt // BusyBox Rootfs // Custom C /proc Daemon</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>