<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#FF5252"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">EDGE COMPUTER VISION</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- Camera Stream Box -->
  <rect x="120" y="100" width="200" height="130" rx="8" fill="#1b2438" stroke="#58E6D9" stroke-width="2"/>
  <!-- Face Bounding Box -->
  <rect x="160" y="125" width="80" height="80" rx="4" fill="none" stroke="#00E676" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="185" cy="150" r="4" fill="#00E676"/>
  <circle cx="215" cy="150" r="4" fill="#00E676"/>
  <path d="M 185 180 Q 200 195 215 180" fill="none" stroke="#00E676" stroke-width="2"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#00E676" text-anchor="middle">MATCH: 96.4% CONF</text>

  <!-- Processing Arrow -->
  <line x1="320" y1="165" x2="400" y2="165" stroke="#FF5252" stroke-width="2.5"/>

  <!-- Compute Box -->
  <rect x="400" y="100" width="170" height="130" rx="8" fill="#1b2438" stroke="#FF5252" stroke-width="2"/>
  <text x="485" y="135" font-family="system-ui" font-size="14" font-weight="bold" fill="#FF5252" text-anchor="middle">Raspberry Pi 4</text>
  <text x="485" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">OpenCV Face Pipeline</text>
  <text x="485" y="180" font-family="monospace" font-size="10" fill="#58E6D9" text-anchor="middle">Latency: ~0.8s</text>
  <text x="485" y="205" font-family="monospace" font-size="10" fill="#00E676" text-anchor="middle">Auth Confirmed</text>

  <!-- Strike Lock Actuator -->
  <line x1="570" y1="165" x2="620" y2="165" stroke="#FFD600" stroke-width="2.5"/>
  <rect x="620" y="115" width="120" height="100" rx="8" fill="#1b2438" stroke="#FFD600" stroke-width="2"/>
  <text x="680" y="145" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFD600" text-anchor="middle">12V Solenoid</text>
  <text x="680" y="165" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">Strike Lock</text>
  <text x="680" y="185" font-family="monospace" font-size="9" fill="#FF5252" text-anchor="middle">Flyback Diode</text>
  <text x="680" y="200" font-family="monospace" font-size="9" fill="#58E6D9" text-anchor="middle">Fail-Secure</text>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#FF5252" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Vision-Based Access Control System</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">OpenCV Python // ESP32-CAM Stream // Raspberry Pi 4 Edge // 12V Strike Lock</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>