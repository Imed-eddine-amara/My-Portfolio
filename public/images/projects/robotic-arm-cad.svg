<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#E040FB"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">MECHANICAL CAD</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- CAD Grid & Technical Drawing -->
  <g stroke="rgba(224, 64, 251, 0.4)" stroke-width="1.5" fill="none">
    <circle cx="200" cy="240" r="40"/>
    <circle cx="200" cy="240" r="10" fill="#E040FB"/>
    
    <!-- Link 1 Base to Elbow -->
    <line x1="200" y1="240" x2="350" y2="150" stroke="#E040FB" stroke-width="8" stroke-linecap="round"/>
    <circle cx="350" cy="150" r="24" fill="#1b2438"/>
    <circle cx="350" cy="150" r="8" fill="#58E6D9"/>

    <!-- Link 2 Forearm -->
    <line x1="350" y1="150" x2="520" y2="170" stroke="#58E6D9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="520" cy="170" r="16" fill="#1b2438"/>
    <circle cx="520" cy="170" r="6" fill="#E040FB"/>

    <!-- Gripper End-Effector -->
    <line x1="520" y1="170" x2="570" y2="150" stroke="#ffffff" stroke-width="3"/>
    <line x1="520" y1="170" x2="570" y2="190" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Dimension Callouts -->
  <text x="275" y="180" font-family="monospace" font-size="11" fill="#E040FB" font-weight="bold">L1 = 180mm</text>
  <text x="435" y="150" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">L2 = 150mm</text>

  <!-- Technical Specs Box -->
  <rect x="520" y="80" width="220" height="90" rx="6" fill="#1b2438" stroke="#E040FB" stroke-width="1.5"/>
  <text x="630" y="105" font-family="system-ui" font-size="13" font-weight="bold" fill="#E040FB" text-anchor="middle">SolidWorks Mates</text>
  <text x="630" y="125" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">Coincident / Concentric</text>
  <text x="630" y="142" font-family="monospace" font-size="10" fill="#58E6D9" text-anchor="middle">Clevis Joints & Short/Long Pins</text>
  <text x="630" y="158" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">Range of Motion Clearance OK</text>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#E040FB" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Robotic Arm Mechanical Assembly & Kinematics</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">SolidWorks 3D CAD // Articulated Mechanism // Clevis Joints // Pin Linkages</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>