<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#00B0FF"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">CONTROL & SIM</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- Coordinate Grid -->
  <line x1="120" y1="260" x2="400" y2="260" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="120" y1="260" x2="120" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="410" y="265" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)">Y (Position)</text>
  <text x="120" y="70" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)">Z (Altitude)</text>

  <!-- Drone Body (Tilted) -->
  <g transform="translate(240, 170) rotate(-15)">
    <!-- Chassis Bar -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#00B0FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
    <!-- Left Rotor -->
    <line x1="-80" y1="0" x2="-80" y2="-15" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="-80" cy="-15" rx="25" ry="4" fill="none" stroke="#58E6D9" stroke-width="2"/>
    <line x1="-80" y1="-15" x2="-80" y2="-45" stroke="#00E676" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="-80" y="-50" font-family="monospace" font-size="11" fill="#00E676" text-anchor="middle">F1 (Thrust)</text>
    <!-- Right Rotor -->
    <line x1="80" y1="0" x2="80" y2="-15" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="80" cy="-15" rx="25" ry="4" fill="none" stroke="#58E6D9" stroke-width="2"/>
    <line x1="80" y1="-15" x2="80" y2="-40" stroke="#00E676" stroke-width="2.5"/>
    <text x="80" y="-45" font-family="monospace" font-size="11" fill="#00E676" text-anchor="middle">F2 (Thrust)</text>
  </g>

  <!-- Cascade PID Blocks -->
  <g transform="translate(450, 90)">
    <rect x="0" y="0" width="260" height="55" rx="6" fill="#1b2438" stroke="#00B0FF" stroke-width="1.5"/>
    <text x="130" y="24" font-family="system-ui" font-size="12" font-weight="bold" fill="#00B0FF" text-anchor="middle">Outer Loop: Position Y & Z</text>
    <text x="130" y="42" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">Generates Target Pitch φ_ref</text>

    <line x1="130" y1="55" x2="130" y2="75" stroke="#58E6D9" stroke-width="2"/>

    <rect x="0" y="75" width="260" height="55" rx="6" fill="#1b2438" stroke="#58E6D9" stroke-width="1.5"/>
    <text x="130" y="99" font-family="system-ui" font-size="12" font-weight="bold" fill="#58E6D9" text-anchor="middle">Inner Loop: Pitch Attitude φ</text>
    <text x="130" y="117" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">Fast Loop Motor Differential</text>

    <line x1="130" y1="130" x2="130" y2="150" stroke="#FFD600" stroke-width="2"/>

    <rect x="0" y="150" width="260" height="40" rx="6" fill="#1b2438" stroke="#FFD600" stroke-width="1.5"/>
    <text x="130" y="175" font-family="monospace" font-size="11" fill="#FFD600" font-weight="bold" text-anchor="middle">Simulink Quadrotor Plant</text>
  </g>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#00B0FF" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Dynamic Simulation of a 2D Drone Model</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">Non-linear Quadrotor Equations of Motion // Altitude Z // Lateral Y // Pitch Phi</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>