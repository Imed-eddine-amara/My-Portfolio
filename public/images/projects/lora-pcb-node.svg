<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Top Decorative Tech Header Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accentGrad)"/>
  <rect x="40" y="30" width="8" height="8" fill="#00E676"/>
  <text x="60" y="38" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="2">SYSTEM ARCHITECTURE SCHEMATIC</text>
  
  <!-- Status Badge Pill -->
  <rect x="620" y="24" width="140" height="24" rx="12" fill="rgba(88,230,217,0.1)" stroke="rgba(88,230,217,0.3)" stroke-width="1"/>
  <circle cx="636" cy="36" r="4" fill="#58E6D9"/>
  <text x="648" y="40" font-family="monospace" font-size="11" fill="#58E6D9" font-weight="bold">HARDWARE / PCB</text>

  <!-- Middle Graphic Area -->
  <g transform="translate(0, 50)">
    
  <!-- PCB Outline -->
  <rect x="100" y="70" width="600" height="230" rx="12" fill="#0b291b" stroke="#00E676" stroke-width="2"/>
  
  <!-- 4-Layer Stackup diagram -->
  <g transform="translate(130, 100)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#00E676" opacity="0.3"/>
    <text x="65" y="16" font-family="monospace" font-size="10" fill="#00E676" font-weight="bold" text-anchor="middle">L1: TOP SIGNAL</text>

    <rect x="0" y="32" width="130" height="24" rx="4" fill="#58E6D9" opacity="0.3"/>
    <text x="65" y="48" font-family="monospace" font-size="10" fill="#58E6D9" font-weight="bold" text-anchor="middle">L2: GND PLANE</text>

    <rect x="0" y="64" width="130" height="24" rx="4" fill="#FFD600" opacity="0.3"/>
    <text x="65" y="80" font-family="monospace" font-size="10" fill="#FFD600" font-weight="bold" text-anchor="middle">L3: POWER PLANE</text>

    <rect x="0" y="96" width="130" height="24" rx="4" fill="#00E676" opacity="0.3"/>
    <text x="65" y="112" font-family="monospace" font-size="10" fill="#00E676" font-weight="bold" text-anchor="middle">L4: BOTTOM SIGNAL</text>

    <text x="65" y="150" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">Controlled Z0 = 50Ω</text>
  </g>

  <!-- Chips on PCB -->
  <!-- STM32WLE5 / RAK3172 -->
  <rect x="300" y="100" width="130" height="130" rx="8" fill="#1b2438" stroke="#58E6D9" stroke-width="2"/>
  <text x="365" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#58E6D9" text-anchor="middle">RAK3172</text>
  <text x="365" y="160" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">STM32WLE5CC</text>
  <text x="365" y="180" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">Cortex-M4 + LoRa</text>
  <text x="365" y="210" font-family="monospace" font-size="10" fill="#00E676" text-anchor="middle">868 MHz / 22dBm</text>

  <!-- Power Architecture Box -->
  <rect x="470" y="100" width="200" height="60" rx="6" fill="#1b2438" stroke="#FFD600" stroke-width="1.5"/>
  <text x="570" y="125" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFD600" text-anchor="middle">SGM6036 Buck Converter</text>
  <text x="570" y="145" font-family="monospace" font-size="11" fill="#00E676" text-anchor="middle">Iq: 10mA -> 450nA (-99%)</text>

  <!-- RS-485 Transceiver -->
  <rect x="470" y="170" width="200" height="60" rx="6" fill="#1b2438" stroke="#58E6D9" stroke-width="1.5"/>
  <text x="570" y="195" font-family="system-ui" font-size="12" font-weight="bold" fill="#58E6D9" text-anchor="middle">THVD2419 RS-485</text>
  <text x="570" y="215" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">±70V Fault Bus Protection</text>
  
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="380" width="800" height="100" fill="rgba(10, 13, 20, 0.85)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="380" x2="160" y2="380" stroke="#00E676" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">RoboCare 4-Layer LoRa Node</text>
  <text x="40" y="448" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.65)">Altium Designer // STM32WLE5 SoC // RS-485 THVD2419 // Solar DPPM</text>

  <!-- Right Side Hardware Watermark -->
  <text x="760" y="440" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">IMED EDDINE AMARA // 2026</text>
</svg>